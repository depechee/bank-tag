<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOG quick open</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#14171f;--muted:#5b6475;--accent:#f26a21;--accent-text:#fff;--border:#e1e4ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1e27;--text:#f0f2f6;--muted:#9aa3b5;--border:#2a3040}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1e27;--text:#f0f2f6;--muted:#9aa3b5;--border:#2a3040}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;text-align:center}
h1{font-size:1.25rem;margin:0 0 6px}
p{margin:0 0 20px;color:var(--muted);font-size:.95rem;line-height:1.4}
.num{font-size:1.5rem;font-weight:700;letter-spacing:.06em;margin:0 0 20px;word-break:break-all}
button{width:100%;border:0;border-radius:14px;padding:16px;font-size:1.05rem;font-weight:600;background:var(--accent);color:var(--accent-text);cursor:pointer}
button+button{margin-top:12px}
.tbc{background:#0a8fe0}
button:active{opacity:.85}
.status{min-height:1.4em;margin:14px 0 0;font-size:.9rem;color:var(--muted)}
a{display:inline-block;margin-top:10px;color:var(--accent);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Copy number &amp; open app</h1>
  <p>Tap your bank, then paste the copied number inside the app.</p>
  <button id="bog" type="button">Bank of Georgia (BOG)</button>
  <button class="tbc" id="tbc" type="button">TBC Bank</button>
  <div class="status" id="status" role="status"></div>
</main>
<script>
// Settings: change these two lines if needed
var BOG_VALUE = "01029017111";
var TBC_VALUE = "GE03TB7513845061100068";
var IS_ANDROID = /android/i.test(navigator.userAgent);
// iPhone: App Store links. Android: Google Play (replace the search links below with the exact app links if you have them)
var BOG_URL = IS_ANDROID ? "https://play.google.com/store/search?q=Bank%20of%20Georgia&c=apps" : "https://apps.apple.com/us/app/bank-of-georgia/id1159368231";
var TBC_URL = IS_ANDROID ? "https://play.google.com/store/search?q=TBC%20Bank&c=apps" : "https://apps.apple.com/us/app/tbc-bank/id766598432";


function fallbackCopy(text){
  try{
    var t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly","");
    t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    var ok = document.execCommand("copy");
    document.body.removeChild(t);
    return ok;
  }catch(e){ return false; }
}
async function copyText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  return fallbackCopy(text);
}
function wire(id, url, name, value){
  document.getElementById(id).addEventListener("click", async function(){
    var s = document.getElementById("status");
    var ok = await copyText(value);
    s.textContent = (ok ? "Copied " + value + ". Opening " : "Couldn’t copy automatically. Opening ") + name + "…";
    setTimeout(function(){ window.location.href = url; }, 500);
  });
}
wire("bog", BOG_URL, "BOG", BOG_VALUE);
wire("tbc", TBC_URL, "TBC", TBC_VALUE);
</script>
</body>
</html>
